name: Build and Deploy Vite App to GitHub Pages
# Newer commits should supersede older pending or in-progress deployments.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build production site (demo disabled)
        run: npm run build
      - name: Verify demo credentials are absent from production assets
        shell: bash
        run: |
          if grep -R -E "BR-admin-1405|BR-support-1405|BR-review-1405" dist/assets; then
            echo "Demo credentials leaked into production assets."
            exit 1
          fi
      - name: Build isolated admin UI preview
        env:
          VITE_ENABLE_ADMIN_DEMO_DATA: 'true'
        run: npm run build -- --base=/bbberah/admin-preview/ --outDir dist/admin-preview
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

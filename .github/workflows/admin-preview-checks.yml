name: Admin preview quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint changed admin preview files
        run: npx eslint src/features/admin/demoData.ts src/features/admin/demoMode.ts src/pages/admin/AdminWorkspace.tsx src/main.tsx
      - name: Production build with demo disabled
        run: npm run build
        env:
          VITE_ENABLE_ADMIN_DEMO_DATA: "false"
      - name: Verify demo credentials are absent from production assets
        shell: bash
        run: |
          if grep -R -E "BR-admin-1405|BR-support-1405|BR-review-1405" dist/assets; then
            echo "Demo credentials leaked into production assets."
            exit 1
          fi

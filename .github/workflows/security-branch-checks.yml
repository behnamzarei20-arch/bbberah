name: Security Branch Checks

on:
  push:
    branches:
      - security/admin-staff-permissions
  pull_request:
    branches:
      - security/admin-staff-permissions

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and build (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
